<div class="app-shell" [class.collapsed]="plegado">
 <aside class="sidebar"><div class="brand"><span class="brand-icon">G</span><div class="brand-name">Gestión<span>INVENTARIO & VENTAS</span></div></div>
 <nav aria-label="Navegación principal">
 @for(item of enlaces;track item.ruta){<a [routerLink]="item.ruta" routerLinkActive="active" [title]="item.nombre"><span class="nav-icon">{{item.icono}}</span><span class="nav-label">{{item.nombre}}</span></a>}
 </nav><div class="sidebar-footer"><div class="user-avatar">{{(authService.obtenerUsername()||'U').slice(0,1).toUpperCase()}}</div><div class="user-info"><b>{{authService.obtenerUsername()}}</b><small>{{authService.obtenerRol()}}</small></div><button class="logout-btn" (click)="cerrarSesion()" title="Cerrar sesión">↪ <span class="nav-label">Cerrar sesión</span></button></div></aside>
 <div class="workspace"><header class="topbar"><button class="collapse-button" (click)="plegado=!plegado" aria-label="Plegar navegación">☰</button><span>Sistema interno de operaciones</span><span class="topbar-right">PEN · S/ <span class="status-dot"></span> Escritorio / Web</span></header><main class="content"><router-outlet/></main></div>
</div>
