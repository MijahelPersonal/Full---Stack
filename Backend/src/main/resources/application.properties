spring.application.name=backend
spring.datasource.url=jdbc:postgresql://localhost:5432/gestor_db
spring.datasource.username=postgres
spring.datasource.password=postgres

app.jwt.secret=CambiaEstaClaveSecretaPorUnaMuyLargaYUnica1234567890ABCDEF
app.jwt.expiration-ms=86400000

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V1__comercio_mvp.sql,classpath:db/migration/V2__username.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.productos.upload-dir=${PRODUCTOS_UPLOAD_DIR:uploads/productos}

# Conserva el bloque DO de PostgreSQL como una sola sentencia.
spring.sql.init.separator=;;
