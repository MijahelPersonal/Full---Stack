<div class="login-screen">
  <main class="login-panel" aria-labelledby="login-title">
    <section class="form-panel">
      <div class="form-intro"><div class="identity-brand"><span class="brand-mark" aria-hidden="true">G</span><b>SistemaGestión</b></div><h1 id="login-title">Bienvenido</h1><p>Inicia sesión para continuar</p></div>
      <form (ngSubmit)="onSubmit()" #f="ngForm" [attr.aria-busy]="cargando()">
        <label for="username">Usuario</label>
        <div class="input-wrap"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><input id="username" name="username" type="text" [(ngModel)]="username" placeholder="Nombre de usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="80" [disabled]="cargando()"/></div>
        <label for="password">Contraseña</label>
        <div class="input-wrap password-wrap"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" name="password" [type]="mostrarPassword()?'text':'password'" [(ngModel)]="password" placeholder="Tu contraseña" autocomplete="current-password" required [disabled]="cargando()"/><button class="password-toggle" type="button" (click)="mostrarPassword.set(!mostrarPassword())" [attr.aria-label]="mostrarPassword()?'Ocultar contraseña':'Mostrar contraseña'" [attr.aria-pressed]="mostrarPassword()" [disabled]="cargando()"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>@if(mostrarPassword()){<path d="m3 3 18 18"/>}</svg></button></div>
        @if(error()){<p class="login-error" role="alert">{{error()}}</p>}
        <button class="login-submit" type="submit" [disabled]="f.invalid||!username.trim()||cargando()">@if(cargando()){<span class="login-spinner" aria-hidden="true"></span>}{{cargando()?'Iniciando sesión…':'Iniciar sesión'}}<span aria-hidden="true">→</span></button>
      </form>
      <p class="access-note"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></svg>Acceso exclusivo para personal autorizado.</p>
    </section>
  </main>
</div>
