spring.config.import=optional:file:.env.properties
spring.application.name=backend
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://localhost:5432/gestor_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration/V0__base_legacy.sql,classpath:db/migration/V1__comercio_mvp.sql,classpath:db/migration/V2__username.sql,classpath:db/migration/V3__catalogo_publico.sql,classpath:db/migration/V4__pedidos_web.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
app.productos.upload-dir=${PRODUCTOS_UPLOAD_DIR:${UPLOAD_DIR:uploads}/productos}
app.web.allowed-origins=${WEB_ALLOWED_ORIGINS:http://localhost:4321,http://127.0.0.1:4321}

# Conserva el bloque DO de PostgreSQL como una sola sentencia.
spring.sql.init.separator=;;
