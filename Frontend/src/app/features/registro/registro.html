<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="brand-dot"></span>
      <span>Consola de Operaciones</span>
    </div>
    <h1>Crear usuario</h1>

    @if (error()) {
      <p class="error-msg">{{ error() }}</p>
    }

    <form (ngSubmit)="onSubmit()">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" [(ngModel)]="nombre" name="nombre" required />

      <label for="email">Correo</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" required />

      <label for="password">Contraseña</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" required minlength="6" />

      <label for="rol">Rol</label>
      <select id="rol" [(ngModel)]="rol" name="rol">
        <option value="ADMINISTRADOR">Administrador</option>
        <option value="SUPERVISOR">Supervisor</option>
        <option value="TECNICO">Técnico</option>
      </select>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="cargando()">
        {{ cargando() ? 'Creando...' : 'Registrar' }}
      </button>
    </form>

    <p class="auth-footer">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>
</div>
